[package]
name = "agent-queue"
version = "0.1.0"
edition = "2021"
description = "TUI and CLI queue manager for tmux-hosted AI coding agent sessions"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
dirs = "5"
notify = "7"
notify-debouncer-mini = "0.5"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
